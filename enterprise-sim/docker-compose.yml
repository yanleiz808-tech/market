# =============================================================================
# 企业模拟环境 —— 供应链部门 + 研发测试部门
# 用于模拟 AI Agent 工作场景（API 优先、全部可自托管、开源）
#
# 用法（按需启动子集，profile 可组合）：
#   docker compose --profile erp up -d            # 只启 Odoo(ERP/供应链)
#   docker compose --profile test up -d           # 只启 Kiwi TCMS(测试管理)
#   docker compose --profile pm up -d             # 只启 OpenProject(项目管理)
#   docker compose --profile rnd up -d            # 只启 Gitea(代码托管)
#   docker compose --profile glue up -d           # 只启 n8n(自动化编排)
#   docker compose --profile docs up -d           # 只启 Nextcloud(企业文档协同)
#   docker compose --profile issues up -d         # 只启 Redmine(问题跟踪/Jira 平替)
#   docker compose --profile chat up -d           # 只启 Mattermost(团队沟通/Teams 平替)
#   docker compose --profile mail up -d           # 只启 邮件服务器+网页邮箱(Outlook 平替)
#   docker compose --profile bi up -d             # 只启 Metabase(BI 报表/Power BI 平替)
#   docker compose --profile all up -d            # 全部启动(≈12-14GB 内存)
# =============================================================================

x-common: &restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # 供应链部门：Odoo 17 CE —— 采购 / 库存 / 制造(MRP) / 销售
  #   UI:  http://localhost:8069   (首次进入创建数据库并安装模块)
  #   API: JSON-RPC /jsonrpc, XML-RPC /xmlrpc/2/
  # ---------------------------------------------------------------------------
  odoo-db:
    image: postgres:16
    profiles: ["erp", "all"]
    <<: *restart
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      POSTGRES_DB: postgres
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:17
    profiles: ["erp", "all"]
    <<: *restart
    depends_on: [odoo-db]
    ports:
      - "8069:8069"
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
    volumes:
      - odoo-data:/var/lib/odoo

  # ---------------------------------------------------------------------------
  # 研发测试部门：Kiwi TCMS —— 测试用例 / 测试计划 / 测试执行
  #   UI:  https://localhost:8444   (自签名证书，浏览器需忽略警告)
  #   API: JSON-RPC /json-rpc/
  #   首次启动后需初始化，见 README「Kiwi 初始化」
  # ---------------------------------------------------------------------------
  kiwi-db:
    image: mariadb:10.11
    profiles: ["test", "all"]
    <<: *restart
    environment:
      MARIADB_ROOT_PASSWORD: ${KIWI_DB_ROOT:-kiwi-root}
      MARIADB_DATABASE: kiwi
      MARIADB_USER: kiwi
      MARIADB_PASSWORD: ${KIWI_DB_PASSWORD:-kiwi}
      MARIADB_CHARSET: utf8mb4
      MARIADB_COLLATE: utf8mb4_unicode_ci
    volumes:
      - kiwi-db-data:/var/lib/mysql

  kiwi:
    image: kiwitcms/kiwi:latest
    profiles: ["test", "all"]
    <<: *restart
    depends_on: [kiwi-db]
    ports:
      - "8081:8080"    # HTTP
      - "8444:8443"    # HTTPS
    environment:
      KIWI_DB_HOST: kiwi-db
      KIWI_DB_PORT: "3306"
      KIWI_DB_NAME: kiwi
      KIWI_DB_USER: kiwi
      KIWI_DB_PASSWORD: ${KIWI_DB_PASSWORD:-kiwi}
    volumes:
      - kiwi-uploads:/Kiwi/uploads

  # ---------------------------------------------------------------------------
  # 项目管理：OpenProject（一体化镜像，内置自己的 Postgres）
  #   UI:  http://localhost:8082   (首次登录 admin/admin，需改密码)
  #   API: REST v3 /api/v3/
  # ---------------------------------------------------------------------------
  openproject:
    image: openproject/openproject:14
    profiles: ["pm", "all"]
    <<: *restart
    ports:
      - "8082:80"
    environment:
      OPENPROJECT_HOST__NAME: localhost:8082
      OPENPROJECT_HTTPS: "false"
      OPENPROJECT_SECRET_KEY_BASE: ${OPENPROJECT_SECRET:-please-change-me}
      OPENPROJECT_DEFAULT__LANGUAGE: zh-CN
    volumes:
      - op-data:/var/openproject/assets
      - op-pgdata:/var/openproject/pgdata

  # ---------------------------------------------------------------------------
  # 研发：Gitea —— 代码托管 + Webhook（可驱动 CI / AI 触发）
  #   UI:  http://localhost:3000   (首次访问完成安装向导，DB 选 SQLite)
  #   API: /api/v1/
  # ---------------------------------------------------------------------------
  gitea:
    image: gitea/gitea:1.22
    profiles: ["rnd", "all"]
    <<: *restart
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://localhost:3000/
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - gitea-data:/data

  # ---------------------------------------------------------------------------
  # 全局自动化编排：n8n —— AI Agent 的「神经中枢」
  #   跨部门流程编排：测试失败 → ERP 建质量单 → 通知 PM
  #   UI:  http://localhost:5678
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    profiles: ["glue", "all"]
    <<: *restart
    ports:
      - "5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Asia/Shanghai
    volumes:
      - n8n-data:/home/node/.n8n

  # ---------------------------------------------------------------------------
  # 企业文档协同：Nextcloud（SharePoint 开源平替）
  #   文档共享 / 版本管理 / 在线协同编辑（配合内置 CODE 服务器）
  #   UI:  http://localhost:8083   (首次访问创建管理员账号)
  #   API: WebDAV /remote.php/dav, OCS /ocs/v2.php
  # ---------------------------------------------------------------------------
  nextcloud-db:
    image: postgres:16
    profiles: ["docs", "all"]
    <<: *restart
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-nextcloud}
    volumes:
      - nextcloud-db-data:/var/lib/postgresql/data

  nextcloud-redis:
    image: redis:7-alpine
    profiles: ["docs", "all"]
    <<: *restart

  nextcloud:
    image: nextcloud:29-apache
    profiles: ["docs", "all"]
    <<: *restart
    depends_on: [nextcloud-db, nextcloud-redis]
    ports:
      - "8083:80"
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-nextcloud}
      REDIS_HOST: nextcloud-redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-admin123456}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
      OVERWRITECLIURL: http://localhost:8083
    volumes:
      - nextcloud-data:/var/www/html

  # ---------------------------------------------------------------------------
  # 问题跟踪：Redmine（Jira 平替）—— 建/管 Bug、Feature、Task 工单
  #   开箱自带 Bug / Feature / Support 三种工单类型，支持工作流流转、版本、看板
  #   UI:  http://localhost:8084   (首次登录 admin/admin，需改密码)
  #   API: REST /issues.json 等（需在 管理→设置→API 里开启）
  # ---------------------------------------------------------------------------
  redmine-db:
    image: postgres:16
    profiles: ["issues", "all"]
    <<: *restart
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: ${REDMINE_DB_PASSWORD:-redmine}
    volumes:
      - redmine-db-data:/var/lib/postgresql/data

  redmine:
    image: redmine:5.1
    profiles: ["issues", "all"]
    <<: *restart
    depends_on: [redmine-db]
    ports:
      - "8084:3000"
    environment:
      REDMINE_DB_POSTGRES: redmine-db
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: ${REDMINE_DB_PASSWORD:-redmine}
      REDMINE_SECRET_KEY_BASE: ${REDMINE_SECRET:-please-change-me-redmine}
    volumes:
      - redmine-files:/usr/src/redmine/files

  # ---------------------------------------------------------------------------
  # 团队沟通：Mattermost（Teams 平替）—— 频道 / 私聊 / 文件分享
  #   UI:  http://localhost:8065   (首次访问创建管理员并建团队)
  #   API: REST /api/v4/, Incoming/Outgoing Webhook
  # ---------------------------------------------------------------------------
  mattermost-db:
    image: postgres:16
    profiles: ["chat", "all"]
    <<: *restart
    environment:
      POSTGRES_DB: mattermost
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: ${MATTERMOST_DB_PASSWORD:-mmuser-pass}
    volumes:
      - mattermost-db-data:/var/lib/postgresql/data

  mattermost:
    image: mattermost/mattermost-team-edition:9.11
    profiles: ["chat", "all"]
    <<: *restart
    depends_on: [mattermost-db]
    ports:
      - "8065:8065"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://mmuser:${MATTERMOST_DB_PASSWORD:-mmuser-pass}@mattermost-db:5432/mattermost?sslmode=disable&connect_timeout=10"
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
    volumes:
      - mattermost-data:/mattermost/data
      - mattermost-config:/mattermost/config

  # ---------------------------------------------------------------------------
  # 邮件：docker-mailserver + Roundcube（Outlook 平替，真·多账号收发）
  #   网页邮箱: http://localhost:8086   (类似 Outlook Web，用邮箱账号登录)
  #   账号需用 setup 命令创建，见 scenarios/email/README.md
  #   API: 标准 IMAP(10143) / SMTP(10587)，供 AI 收发
  # ---------------------------------------------------------------------------
  mailserver:
    image: mailserver/docker-mailserver:latest
    profiles: ["mail", "all"]
    <<: *restart
    hostname: mail.corp.local
    ports:
      - "10025:25"
      - "10143:143"
      - "10587:587"
      - "10993:993"
    environment:
      ENABLE_FAIL2BAN: "0"
      PERMIT_DOCKER: network
      SSL_TYPE: ""          # 本地模拟，不启用 TLS
      ONE_DIR: "1"
    cap_add: [NET_ADMIN]
    volumes:
      - mail-data:/var/mail
      - mail-state:/var/mail-state
      - mail-logs:/var/log/mail
      - mail-config:/tmp/docker-mailserver

  roundcube:
    image: roundcube/roundcubemail:latest
    profiles: ["mail", "all"]
    <<: *restart
    depends_on: [mailserver]
    ports:
      - "8086:80"
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: mailserver
      ROUNDCUBEMAIL_DEFAULT_PORT: "143"
      ROUNDCUBEMAIL_SMTP_SERVER: mailserver
      ROUNDCUBEMAIL_SMTP_PORT: "587"
    volumes:
      - roundcube-data:/var/www/html

  # ---------------------------------------------------------------------------
  # BI 报表：Metabase（Power BI 平替）—— 连各库出 quality 仪表盘
  #   UI:  http://localhost:3002   (首次创建管理员，添加数据源)
  #   可连 odoo-db / kiwi-db / redmine-db 做跨系统质量分析
  # ---------------------------------------------------------------------------
  metabase-db:
    image: postgres:16
    profiles: ["bi", "all"]
    <<: *restart
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:-metabase}
    volumes:
      - metabase-db-data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:latest
    profiles: ["bi", "all"]
    <<: *restart
    depends_on: [metabase-db]
    ports:
      - "3002:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: "5432"
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-metabase}
      MB_DB_HOST: metabase-db

volumes:
  odoo-db-data:
  odoo-data:
  kiwi-db-data:
  kiwi-uploads:
  op-data:
  op-pgdata:
  gitea-data:
  n8n-data:
  nextcloud-db-data:
  nextcloud-data:
  redmine-db-data:
  redmine-files:
  mattermost-db-data:
  mattermost-data:
  mattermost-config:
  mail-data:
  mail-state:
  mail-logs:
  mail-config:
  roundcube-data:
  metabase-db-data:
