  //    想单独看"讲话原文"可再加:https://www.federalreserve.gov/feeds/speeches.xml

  //    注:BLS(非农/CPI/PPI)封锁了服务器抓取且无 CORS,浏览器拿不到官方 feed —— 那几个数据靠新闻卡秒报、日历卡看时间。
  { name:'📈 BEA · PCE / GDP', url:'https://apps.bea.gov/rss/rss.xml', max:8 },
  // 📊 复刻 IBKR「Daily Lineup → Today's Top Ten」:它聚合 Dow Jones / StreetInsider / Reuters / Refinitiv 四家。

  //    Dow Jones≈WSJ/MarketWatch/Barron's(同属道琼斯)、Reuters=Refinitiv、StreetInsider(盘前异动/评级)。max:10 取"十大"。
  { name:'📊 今日十大 · IBKR 同款', url:'https://news.google.com/rss/search?q=when%3A1d%20(site%3Areuters.com%20OR%20site%3Astreetinsider.com%20OR%20site%3Awsj.com%20OR%20site%3Amarketwatch.com%20OR%20site%3Abarrons.com)%20(Fed%20OR%20CPI%20OR%20inflation%20OR%20earnings%20OR%20tariffs%20OR%20oil%20OR%20stocks%20OR%20%22stock%20market%22%20OR%20Nasdaq%20OR%20Dow%20OR%20upgrade%20OR%20downgrade%20OR%20%22price%20target%22)&hl=en-US&gl=US&ceid=US:en', max:10 },

  //    cal:true 触发自定义解析(parseCalendar):只取 美国(USD) + 全球高影响,剔除低影响噪音,只留未来事件,按时间升序。feed 时间是 UTC,显示时转本地。
  { name:'📅 经济日历 · 本周', cal:true, url:'https://nfs.faireconomy.media/ff_calendar_thisweek.xml', max:40 },

  // 以下三家是"站点 + 主题词过滤"(只用名词主题组,不加烈度词,免得漏掉重要但措辞平淡的政策新闻)
  { name:'Reuters · 市场',  url:'https://news.google.com/rss/search?q=when%3A1d%20site%3Areuters.com%20(Fed%20OR%20CPI%20OR%20inflation%20OR%20%22interest%20rates%22%20OR%20Treasury%20OR%20yields%20OR%20earnings%20OR%20guidance%20OR%20tariffs%20OR%20%22trade%20war%22%20OR%20oil%20OR%20recession%20OR%20GDP%20OR%20jobs%20OR%20merger%20OR%20acquisition%20OR%20bankruptcy%20OR%20layoffs%20OR%20stocks%20OR%20%22stock%20market%22)&hl=en-US&gl=US&ceid=US:en', max:8 },
  { name:'Bloomberg · 市场',url:'https://news.google.com/rss/search?q=when%3A1d%20site%3Abloomberg.com%20(Fed%20OR%20CPI%20OR%20inflation%20OR%20%22interest%20rates%22%20OR%20Treasury%20OR%20yields%20OR%20earnings%20OR%20guidance%20OR%20tariffs%20OR%20%22trade%20war%22%20OR%20oil%20OR%20recession%20OR%20GDP%20OR%20jobs%20OR%20merger%20OR%20acquisition%20OR%20bankruptcy%20OR%20layoffs%20OR%20stocks%20OR%20%22stock%20market%22)&hl=en-US&gl=US&ceid=US:en', max:8 },
  { name:'WSJ · 市场',      url:'https://news.google.com/rss/search?q=when%3A1d%20site%3Awsj.com%20(Fed%20OR%20CPI%20OR%20inflation%20OR%20%22interest%20rates%22%20OR%20Treasury%20OR%20yields%20OR%20earnings%20OR%20guidance%20OR%20tariffs%20OR%20%22trade%20war%22%20OR%20oil%20OR%20recession%20OR%20GDP%20OR%20jobs%20OR%20merger%20OR%20acquisition%20OR%20bankruptcy%20OR%20layoffs%20OR%20stocks%20OR%20%22stock%20market%22)&hl=en-US&gl=US&ceid=US:en', max:8 },
  { name:'MarketWatch',     url:'https://feeds.content.dowjones.io/public/rss/mw_topstories', max:8 }, // 直连发布商 RSS(实时),取代原 Google News 搜索版,消除索引延迟
  { name:'Yahoo Finance',   url:'https://news.google.com/rss/search?q=when:1d%20site:finance.yahoo.com&hl=en-US&gl=US&ceid=US:en', max:8 },
  { name:'美股盘前 · 综合', url:'https://news.google.com/rss/search?q=US%20stock%20market%20premarket%20OR%20futures%20when:1d&hl=en-US&gl=US&ceid=US:en', max:8 },
  { name:'华尔街见闻',      url:'https://news.google.com/rss/search?q=when:1d%20site:wallstreetcn.com&hl=zh-CN&gl=CN&ceid=CN:zh-Hans', max:8 },
  { name:'美股 · 中文综合', url:'https://news.google.com/rss/search?q=美股%20when:1d&hl=zh-CN&gl=CN&ceid=CN:zh-Hans', max:8 },
];

/* 兜底 CORS 代理(主力是下面的 rss2json),并行竞速,谁先返回有效 RSS 用谁 */
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
];

const CACHE_KEY = 'premarket_news_cache_v1';
const grid = document.getElementById('grid');
const cards = {}; // name -> {ul, status}

/* ---------- 构建卡片骨架 ---------- */
function buildCards(){
  SOURCES.forEach(s=>{
    const card = document.createElement('div'); card.className='card';
    const head = document.createElement('div'); head.className='card-head';
    const name = document.createElement('span'); name.className='name'; name.textContent=s.name;
    const status = document.createElement('span'); status.className='status'; status.textContent='待刷新';
    const retry = document.createElement('button'); retry.className='retry'; retry.textContent='重试';
    retry.onclick = ()=> loadOne(s);
    head.append(name,status,retry);
    const ul = document.createElement('ul');
    card.append(head,ul); grid.append(card);
    cards[s.name] = {ul,status};
  });
}

/* ---------- 抓取 + 解析单个源 ---------- */
async function fetchWithTimeout(url, ms=9000){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(), ms);
  try{ return await fetch(url,{cache:'no-store',signal:c.signal}); }
  finally{ clearTimeout(t); }
}
const deadline = ms => new Promise((_,rej)=>setTimeout(()=>rej(new Error('超时')), ms));

// Google News 会在标题尾部加 "- 来源"(如 "...rates - Reuters"),卡片已标来源,去掉它
// 否则中英对照时会被翻成 "- 路透中文网/- 彭博社" 造成"全是中文网"的错觉
function cleanTitle(t){
  t=(t||'').trim();
  const i=t.lastIndexOf(' - ');
  if(i>20 && (t.length-i-3)<=32) return t.slice(0,i).trim(); // 尾段够短(像来源名)才去掉
  return t;
}

// 按时间倒序(最新在前)。Google News 默认按"相关度"排,会把十几小时前的旧文排在最新文之上,
// 还可能把最新的挤出前 max 条被砍掉。所以先排序、再截断,保证每张卡顶部就是最新。
const byNew=(a,b)=>(Date.parse(b.date)||0)-(Date.parse(a.date)||0);

function mapJsonItems(items, max){
  return items.map(it=>({
    title:cleanTitle(it.title), link:it.link||'#',
    // rss2json 的 pubDate 是 UTC 但无时区标记,补 'Z' 否则会被当本地时间算错
    date: it.pubDate ? it.pubDate.replace(' ','T')+'Z' : ''
  })).sort(byNew).slice(0,max);
}

// 渠道 A:rss2json(返回 JSON;命中缓存时最快,但新源会被限流)
async function viaRss2json(url, max){
  const api='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(url);
  const r = await Promise.race([fetchWithTimeout(api, 9000), deadline(10000)]);
  if(!r.ok) throw new Error('rss2json HTTP '+r.status);
  const j = await Promise.race([r.json(), deadline(4000)]);
  if(j && j.status==='ok' && Array.isArray(j.items) && j.items.length) return mapJsonItems(j.items, max);
  throw new Error('rss2json '+((j&&j.status)||'empty'));
}

// 渠道 B:CORS 代理抓 XML(rss2json 限流新源时由它兜底)
async function tryProxy(wrap, url, ms){
  const r = await Promise.race([fetchWithTimeout(wrap(url), ms), deadline(ms+1500)]);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const txt = await Promise.race([r.text(), deadline(ms+1500)]); // 防 body 读取卡死
  if(txt && /<(rss|feed|item|entry)[\s>]/i.test(txt)) return txt; // 确认是 RSS,挡错误页
  throw new Error('非 RSS 响应');
}
async function viaProxy(wrap, url, max){ return parseFeed(await tryProxy(wrap, url, 8000), max); }

// 渠道 C:浏览器直连(仅对开了 CORS 的源有效,如 CNBC/MarketWatch/多数官方 feed)。
// 不依赖任何第三方,最快最稳;没开 CORS 的源(美联储/Google News)会被浏览器拦下、自动落败,不影响竞速。
async function viaDirect(url, max){
  const r = await Promise.race([fetchWithTimeout(url, 8000), deadline(9000)]);
  if(!r.ok) throw new Error('direct HTTP '+r.status);
  const txt = await Promise.race([r.text(), deadline(4000)]);
  if(txt && /<(rss|feed|item|entry)[\s>]/i.test(txt)) return parseFeed(txt, max);
  throw new Error('direct 非 RSS');
}

/* 取一个源:直连 + rss2json + 各代理"同时竞速",谁先拿到有效头条用谁;整轮失败再重试一次 */
async function fetchItems(url, max){
  const race = ()=> Promise.any([ viaDirect(url,max), viaRss2json(url,max), ...PROXIES.map(w=>viaProxy(w,url,max)) ]);
  try{ return await race(); }
  catch(e){ await new Promise(r=>setTimeout(r, 900)); return await race(); }
}

/* ===== 📅 经济日历(faireconomy 周历:结构化预定事件,非新闻)=====
   feed 无 CORS、且不是 RSS(rss2json 不认),所以走"直连+代理"拿原始 XML,再用 parseCalendar 自定义解析 */
function calTs(d, t){            // 日期 MM-DD-YYYY + 时间如 "8:30am"(UTC)→ 毫秒
  if(!d) return NaN;
  const p=d.split('-').map(Number); if(p.length<3 || !p[2]) return NaN;
  let hh=0, mm=0; const m=/^(\d{1,2}):(\d{2})\s*(am|pm)$/i.exec((t||'').trim());
  if(m){ hh=(+m[1])%12; if(/pm/i.test(m[3])) hh+=12; mm=+m[2]; }
  return Date.UTC(p[2], p[0]-1, p[1], hh, mm);
}
function calWhen(ts){           // UTC 毫秒 → 本地"周X M/D HH:MM"(全天/待定无时间)
  if(isNaN(ts)) return '时间待定';
  const d=new Date(ts), z=n=>String(n).padStart(2,'0');
  return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]
    +` ${d.getMonth()+1}/${d.getDate()} ${z(d.getHours())}:${z(d.getMinutes())}`;
}
function parseCalendar(xml, max){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  return [...doc.querySelectorAll('event')].map(e=>{
    const g=t=>e.querySelector(t)?.textContent?.trim()||'';
    return { cal:true, title:g('title'), country:g('country'), impact:g('impact'),
             forecast:g('forecast'), previous:g('previous'), link:g('url')||'#',
             ts:calTs(g('date'), g('time')) };
  })
  .filter(e=> (e.country==='USD' || e.impact==='High') && e.impact!=='Low')  // 美国 + 全球高影响,剔除低影响噪音
  .sort((a,b)=>(a.ts||0)-(b.ts||0))   // 固定显示整周(周日→周六)按时间升序;过去的不删,只在渲染时变暗
  .slice(0,max);
}
async function calRaw(wrap, url){ // 取原始 XML 并确认含 <event>(挡错误页)
  const r = await Promise.race([fetchWithTimeout(wrap?wrap(url):url, 8000), deadline(9500)]);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const txt = await Promise.race([r.text(), deadline(4000)]);
  if(/<event[\s>]/i.test(txt)) return txt;
  throw new Error('非日历XML');
}
async function fetchCalendar(url, max){
  const race=()=>Promise.any([ calRaw(null,url), ...PROXIES.map(w=>calRaw(w,url)) ]); // 直连多被 CORS 拦,无害落败
  let xml; try{ xml=await race(); }catch(e){ await new Promise(r=>setTimeout(r,900)); xml=await race(); }
  return parseCalendar(xml, max);
}

/* 并发限制器:同时最多 n 个,避免代理限流 */
async function runLimited(items, worker, n){
  let i=0;
  await Promise.all(Array.from({length:Math.min(n,items.length)}, async()=>{
    while(i<items.length){ await worker(items[i++]); }
  }));
}

function parseFeed(xml, max){
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  if(doc.querySelector('parsererror')) throw new Error('解析失败');
  let items = [...doc.querySelectorAll('item')];
  if(!items.length) items = [...doc.querySelectorAll('entry')]; // Atom
  return items.map(it=>{
    const title = cleanTitle(it.querySelector('title')?.textContent||'');
    let link = it.querySelector('link')?.textContent?.trim();
    if(!link){ link = it.querySelector('link')?.getAttribute('href') || '#'; }
    const date = it.querySelector('pubDate')?.textContent
              || it.querySelector('updated')?.textContent
              || it.querySelector('published')?.textContent || '';
    return {title, link, date};
  }).filter(x=>x.title).sort(byNew).slice(0,max);
}

function timeAgo(str){
  if(!str) return '';
  const d=new Date(str); if(isNaN(d)) return '';
  const s=(Date.now()-d.getTime())/1000;
  if(s<60) return '刚刚';
  if(s<3600) return Math.floor(s/60)+' 分钟前';
  if(s<86400) return Math.floor(s/3600)+' 小时前';
  return Math.floor(s/86400)+' 天前';
}

const lastItems = {}; // name -> items,用于切换对照时重渲染

function renderItems(name, items){
  lastItems[name] = items;
  const ul = cards[name].ul; ul.innerHTML='';
  if(!items.length){ ul.innerHTML='<div class="empty">暂无内容</div>'; return; }
  items.forEach(it=>{
    const li=document.createElement('li');
    const a=document.createElement('a');
    a.href=it.link; a.target='_blank'; a.rel='noopener';
    // 日历卡:标题前加影响级别圆点(🔴高/🟠中/🏖️假期)
    if(it.cal){
      const dot = it.impact==='High'?'🔴':it.impact==='Medium'?'🟠':it.impact==='Holiday'?'🏖️':'⚪';
      a.textContent = dot+' '+it.title;
    } else a.textContent = it.title;
    li.append(a);
    if(bilingual){
      const tl=document.createElement('div'); tl.className='tl-line pending'; tl.textContent='翻译中…';
      li.append(tl);
      translate(it.title).then(tx=>{
        if(tx){ tl.textContent=tx; tl.classList.remove('pending'); }
        else { tl.remove(); }
      });
    }
    if(it.cal){   // 日历:显示 本地时间 · 预期 · 前值;已过去的保留但变暗 + 标"✓ 已公布"(整周固定可见)
      const past = !isNaN(it.ts) && it.ts < Date.now();
      if(past) li.style.opacity='.45';
      let line = (past?'✓ 已公布 · ':'') + calWhen(it.ts);
      if(it.forecast) line+=' · 预期 '+it.forecast;
      if(it.previous) line+=' · 前值 '+it.previous;
      const sp=document.createElement('div'); sp.className='t'; sp.textContent=line; li.append(sp);
    } else {
      const t=timeAgo(it.date);
      if(t){ const sp=document.createElement('div'); sp.className='t'; sp.textContent=t; li.append(sp); }
    }
    ul.append(li);
  });
}

/* ============== 中英对照:免费翻译 + 缓存 + 并发限制 ============== */
let bilingual = localStorage.getItem('pm_bilingual') !== '0';
const TR_KEY='pm_trans_cache_v1';
function getTransCache(){ try{ return JSON.parse(localStorage.getItem(TR_KEY))||{}; }catch{ return {}; } }
function saveTransCache(c){ try{ localStorage.setItem(TR_KEY, JSON.stringify(c)); }catch{} }
const isCJK = t => /[一-鿿]/.test(t);

// 并发队列(最多 4 个同时翻译,避免被限流)
const trQ=[]; let trActive=0;
function enqueue(fn){ return new Promise(res=>{ trQ.push({fn,res}); pump(); }); }
function pump(){ while(trActive<4 && trQ.length){ const {fn,res}=trQ.shift(); trActive++;
  fn().then(res).catch(()=>res('')).finally(()=>{ trActive--; pump(); }); } }

async function translate(text){
  const tl = isCJK(text) ? 'en' : 'zh-CN';
  const sl = isCJK(text) ? 'zh-CN' : 'en';
  const key = tl+'|'+text;
  const cache = getTransCache();
  if(cache[key]) return cache[key];
  const out = await enqueue(()=>doTranslate(text, sl, tl));
  if(out){ cache[key]=out; saveTransCache(cache); }
  return out;
}

async function doTranslate(text, sl, tl){
  const g = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
  // 1) Google 直连  2) Google 经代理  3) MyMemory
  const tries = [ ()=>fetch(g,{cache:'no-store'}),
                  ...PROXIES.map(w=>()=>fetch(w(g),{cache:'no-store'})) ];
  for(const t of tries){
    try{
      const r=await t(); if(!r.ok) continue;
      const j=await r.json();
      const s=(j[0]||[]).map(x=>x[0]).join('').trim();
      if(s) return s;
    }catch{}
  }
  try{
    const m=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sl}|${tl}`;
    const r=await fetch(m); const j=await r.json();
    const s=(j.responseData?.translatedText||'').trim();
    if(s && !/MYMEMORY WARNING/i.test(s)) return s;
  }catch{}
  return '';
}

function reRenderAll(){ SOURCES.forEach(s=>{ if(lastItems[s.name]) renderItems(s.name, lastItems[s.name]); }); }

async function loadOne(s){
  const c=cards[s.name];
  c.status.innerHTML='<span class="spin"></span>抓取中';
  try{
    const items = s.cal ? await fetchCalendar(s.url, s.max) : await fetchItems(s.url, s.max);
    renderItems(s.name, items);
    c.status.textContent=items.length+' 条';
    saveCache(s.name, items);
  }catch(e){
    c.status.textContent='失败';
    if(!c.ul.children.length || c.ul.querySelector('.error,.loading')){
      c.ul.innerHTML='<div class="error">抓取失败:'+(e.message||e)+'</div>';
    }
  }
}

/* ---------- 缓存(重新打开时先显示上次结果) ---------- */
function saveCache(name, items){
  let c={}; try{ c=JSON.parse(localStorage.getItem(CACHE_KEY))||{}; }catch{}
  c[name]=items; c.__ts=Date.now();
  localStorage.setItem(CACHE_KEY, JSON.stringify(c));
}
function loadCache(){
  let c; try{ c=JSON.parse(localStorage.getItem(CACHE_KEY)); }catch{ return false; }
  if(!c) return false;
  SOURCES.forEach(s=>{ if(c[s.name]){ renderItems(s.name,c[s.name]); cards[s.name].status.textContent='缓存'; }});
  if(c.__ts) setUpdated(new Date(c.__ts), true);
  return true;
}

function setUpdated(d, cached){
  const z=n=>String(n).padStart(2,'0');
  document.getElementById('lastUpdated').textContent =
    (cached?'上次刷新 ':'已更新 ')+`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
}

async function refreshAll(){
  const btn=document.getElementById('refresh');
  btn.disabled=true; btn.textContent='⟳ 抓取中…';
  await runLimited(SOURCES, loadOne, 2);
  setUpdated(new Date(), false);
  btn.disabled=false; btn.textContent='⟳ 刷新';
}

document.getElementById('refresh').onclick=refreshAll;

const biBox=document.getElementById('bi');
biBox.checked=bilingual;
biBox.onchange=()=>{ bilingual=biBox.checked;
  localStorage.setItem('pm_bilingual', bilingual?'1':'0'); reRenderAll(); };

(function installPWA(){
  const icon="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>"
    +"<rect width='512' height='512' rx='110' fill='#0d1117'/>"
    +"<polyline points='64,348 188,232 280,300 410,150' fill='none' stroke='#26d07c' stroke-width='30' stroke-linecap='round' stroke-linejoin='round'/>"
    +"<polyline points='330,150 410,150 410,232' fill='none' stroke='#26d07c' stroke-width='30' stroke-linecap='round' stroke-linejoin='round'/></svg>";
  const iconUrl='data:image/svg+xml,'+encodeURIComponent(icon);
  // iOS 主屏图标
  const al=document.createElement('link'); al.rel='apple-touch-icon'; al.href=iconUrl; document.head.appendChild(al);
  // Android/Chrome manifest(用 Blob,免单独文件)
  try{
    const dir=location.pathname.replace(/[^/]*$/,'');   // 当前目录,随便放哪都对
    const manifest={ name:'美股盘前头条', short_name:'盘前头条',
      start_url:location.pathname, scope:dir,
      display:'standalone', orientation:'portrait', background_color:'#0d1117', theme_color:'#0d1117',
      icons:[{src:iconUrl, sizes:'512x512', type:'image/svg+xml', purpose:'any maskable'}] };
    const ml=document.createElement('link'); ml.rel='manifest';
    ml.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
    document.head.appendChild(ml);
  }catch(e){}
})();

/* 启动:先建卡片→显示缓存→无缓存则自动抓一次 */
buildCards();
if(!loadCache()) refreshAll();
